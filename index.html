<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2b53">
  <title>Deutsch Macerası</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- ANA EKRAN -->
    <section id="screen-home" class="screen active">
      <header class="stage">
        <div class="stage-sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="stage-text">
          <p class="eyebrow">A1 · Almanca</p>
          <h1>Deutsch<br><span>Macerası</span></h1>
          <p class="bubble" id="hero-bubble">Hallo! Ich bin Max.</p>
        </div>
        <div class="stage-max" id="hero-max"></div>
        <div class="stage-ground" aria-hidden="true"></div>
      </header>

      <div class="stats">
        <div class="stat s-level"><span class="s-ico" data-icon="star"></span><div><b id="p-level">1</b><small>Seviye</small></div></div>
        <div class="stat s-streak"><span class="s-ico" data-icon="flame"></span><div><b id="p-streak">0</b><small>Gün serisi</small></div></div>
        <div class="stat s-badge"><span class="s-ico" data-icon="medal"></span><div><b id="p-badges">0</b><small>Rozet</small></div></div>
        <div class="xpbar" aria-label="Deneyim puanı"><div id="p-xpfill"></div><span id="p-xptext">0 / 50 XP</span></div>
      </div>

      <h2>Tema</h2>
      <div id="theme-list" class="chips"></div>

      <h2>Oyunlar</h2>
      <div id="game-list" class="games"></div>

      <h2>Rozetler</h2>
      <div id="badge-list" class="badges"></div>

      <footer class="foot">
        <button class="link" id="btn-reset">İlerlemeyi sıfırla</button>
      </footer>
    </section>

    <!-- OYUN EKRANI -->
    <section id="screen-game" class="screen">
      <div class="hud">
        <button class="icon-btn" id="btn-quit" aria-label="Oyundan çık" data-icon="close"></button>
        <div class="progress"><div id="hud-progress"></div></div>
        <div class="hud-info" id="hud-info"></div>
        <div class="hud-score"><span data-icon="star"></span><b id="hud-score">0</b></div>
      </div>
      <div id="game-area"></div>
      <div id="feedback" class="feedback" hidden></div>
    </section>

    <!-- SONUÇ EKRANI -->
    <section id="screen-result" class="screen">
      <div class="result">
        <div class="result-stage">
          <div class="stage-sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div id="res-mascot"></div>
        </div>
        <div class="stars" id="res-stars"></div>
        <h2 id="res-title">Toll!</h2>
        <p id="res-text"></p>
        <p class="xp-gain"><b id="res-xp">+0</b> XP<span id="res-level"></span></p>
        <div id="res-badges"></div>
        <div class="row">
          <button class="btn" id="btn-again">Tekrar oyna</button>
          <button class="btn secondary" id="btn-home">Ana menü</button>
        </div>
      </div>
    </section>
  </div>

  <div id="confetti" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
